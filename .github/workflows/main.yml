name: Build Mod 1.21.1

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 注意：这里去掉了 chmod 步骤

      - name: Build with Gradle (使用系统 Gradle)
        # 使用 arguments 参数可以让它自动处理版本兼容性，如果直接 run: gradle build 报错，可以尝试这个
        uses: gradle/actions/setup-gradle@v3
        with:
           arguments: build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AStages-1.21.1-Fixed
          path: build/libs/*.jar
          if-no-files-found: error
