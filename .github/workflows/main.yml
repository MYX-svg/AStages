name: Build Mod 1.21.1

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # 注意：这里去掉了 cache: 'gradle'，因为后面 setup-gradle 会自动处理缓存，避免冲突

      - name: Build with Gradle (强制指定版本)
        uses: gradle/actions/setup-gradle@v3
        with:
           # 关键修复在这里：既然没有 gradlew，我们就直接告诉它用 8.8 版本
           gradle-version: '8.8'
           arguments: build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AStages-1.21.1-Fixed
          path: build/libs/*.jar
          if-no-files-found: error
